name: Technocore heartbeat

on:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q cryptography

      - name: Run heartbeat (with retry)
        env:
          TECHNOCORE_SEED_HEX: ${{ secrets.TECHNOCORE_SEED_HEX }}
          TECHNOCORE_MAILBOX_ROOM: ${{ vars.TECHNOCORE_MAILBOX_ROOM }}
        run: |
          for i in 1 2 3; do
            echo "=== Heartbeat attempt $i/3 ==="
            if python3 technocore_client.py heartbeat "$TECHNOCORE_MAILBOX_ROOM"; then
              echo "Heartbeat succeeded on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, waiting 5 minutes before retry..."
              sleep 300
            fi
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Persist mailbox/nonce state
        run: |
          git config user.name "technocore-heartbeat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .technocore-state
          git diff --cached --quiet || git commit -m "heartbeat: update local state"
          git push
